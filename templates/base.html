<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой блог</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
        }
        .brand-title {
            letter-spacing: 2px;
            text-transform: uppercase;
        .article-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
    }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    
    <header class="py-4 border-bottom border-secondary-subtle">
        <div class="container text-center">
            <h1 class="fw-light">Мой блог</h1>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="text-center">
            <h2 class="fw-light">Добро пожаловать</h2>
            <p class="text-muted">Личный блог</p>
        </div>
    </main>

    <footer class="py-3 border-top border-secondary-subtle text-center text-muted">
        <div class="container">
            © <span id="year"></span> Мой блог
        </div>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
