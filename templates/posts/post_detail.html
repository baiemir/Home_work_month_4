<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | Мой блог</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212; /* Тот же глубокий тёмный фон */
        }
        .brand-title {
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .article-card {
            background-color: #1e1e1e; /* Карточка в тон главной страницы */
            border: 1px solid #2d2d2d;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="py-4 mb-5 border-bottom border-secondary-subtle">
        <div class="container">
            <a href="{#}" class="text-decoration-none text-light">
                <h1 class="fw-light text-center mb-0 brand-title fs-3">Мой блог</h1>
            </a>
        </div>
    </header>

    <main class="flex-grow-1">
        <div class="container">
            <article class="card article-card mx-auto p-4 p-md-5 shadow-sm rounded-4" style="max-width: 800px;">

                <h2 class="fw-normal mb-3 text-white">
                    {{ post.title }}
                </h2>

                <p class="text-muted small mb-4">
                    {% if post.published_date %}
                        Опубликовано: {{ post.published_date|date:"j E Y" }}
                    {% else %}
                        Опубликовано: 1 июня 2026
                    {% endif %}
                </p>

                <div class="lh-lg text-secondary fs-5" style="color: #e0e0e0 !important;">
                    {{ post.content|linebreaks }}
                </div>
                
                <div class="mt-5 pt-4 border-top border-secondary-subtle">
                    <a href="{% url 'post_list' post.pk %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        ← Назад к статьям
                    </a>
                </div>

            </article>
        </div>
    </main>

    <footer class="py-4 mt-5 border-top border-secondary-subtle text-center text-muted small">
        <div class="container">
            © <span id="year"></span> Мой блог
        </div>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

</body>
</html>
