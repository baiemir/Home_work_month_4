<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение удаления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3>Удалить пост?</h3>
        <p class="text-muted">Вы уверены, что хотите безвозвратно удалить пост "<strong>{{ object.title }}</strong>"?</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 mb-2">Да, удалить</button>
            <a href="{% url 'my_post' %}" class="btn btn-secondary w-100">Отмена</a>
        </form>
    </div>
</body>
</html>
