<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>


<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="login-container p-4 bg-white rounded shadow-sm">
        <h2 class="text-center mb-4 fw-bold text-dark">Создать аккаунт</h2>
        
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <ul class="mb-0 ps-3">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                        <li><strong>{{ field }}:</strong> {{ error }}</li>
                    {% endfor %}
                {% endfor %}
                </ul>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
            </div>
        {% endif %}
        
        <form class="needs-validation" novalidate method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" name="email" class="form-control {% if form.errors.email %}is-invalid{% endif %}" id="email" placeholder="name@example.com" required>
                <div class="invalid-feedback">
                    Пожалуйста, введите корректный email.
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control {% if form.errors.password %}is-invalid{% endif %}" id="password" placeholder="Введите пароль" required>
                <div class="invalid-feedback">
                    Пожалуйста, введите пароль.
                </div>
            </div>

            <div class="mb-4">
                <label for="second_password" class="form-label">Подтвердите пароль</label>
                <input type="password" name="second_password" class="form-control {% if form.errors.second_password %}is-invalid{% endif %}" id="second_password" placeholder="Повторите пароль" required>
                <div class="invalid-feedback">
                    Пароли должны совпадать.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Продолжить</button>
            
        </form>
    </div>

    <script>
        (() => {
          'use strict'
          const forms = document.querySelectorAll('.needs-validation')
          Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              }
              form.classList.add('was-validated')
            }, false)
          })
        })()
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
