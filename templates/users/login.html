<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Центрируем форму на экране */
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="card shadow-sm login-card">
    <div class="card-body">
        <h3 class="card-title text-center mb-4">Вход</h3>
        
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="emailInput" class="form-label">Электронная почта</label>
                <input 
                    type="email"  name="email" 
                    class="form-control" 
                    id="emailInput" 
                    placeholder="name@example.com" 
                    required
                >
                <div class="invalid-feedback">
                    Пожалуйста, введите корректный email.
                </div>
            </div>

            <div class="mb-3">
                <label for="passwordInput" class="form-label">Пароль</label>
                <input 
                    type="password" 
                    name="password"
                    class="form-control" 
                    id="passwordInput" 
                    placeholder="••••••••" 
                    required
                >
                <div class="invalid-feedback">
                    Пожалуйста, введите пароль.
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Запомнить
                    </label>
                </div>
                <a href="#" class="text-decoration-none small">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Войти</button>
            
        </form> </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Скрипт Bootstrap для валидации теперь будет работать, 
    // так как мы добавили класс 'needs-validation' и 'novalidate' в тег <form> выше.
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

</body>
</html>
